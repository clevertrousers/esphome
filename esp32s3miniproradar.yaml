# Backlight Power Control for Mini Pro onboard screen
output:
  - platform: gpio
    pin: GPIO33
    id: display_backlight

# SPI Bus for onboard TFT screen
spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11

# Updated Hardware UART pins for LD2451
uart:
  - id: ld2451_uart
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 115200

# Template Sensors for Radar Data
sensor:
  - platform: template
    name: "Vehicle Speed (km/h)"
    id: vehicle_speed_kmh
    unit_of_measurement: "km/h"
    accuracy_decimals: 0
    icon: "mdi:speedometer"

  - platform: template
    name: "Vehicle Distance"
    id: vehicle_distance
    unit_of_measurement: "m"
    accuracy_decimals: 1
    icon: "mdi:ruler"

# LD2451 Frame Parser
interval:
  - interval: 100ms
    then:
      - lambda: |-
          while (id(ld2451_uart).available() >= 16) {
            uint8_t header[4];
            id(ld2451_uart).read_array(header, 4);

            // Match LD2451 frame header (0xAA 0xFF)
            if (header[0] == 0xAA && header[1] == 0xFF) {
              uint8_t buffer[12];
              id(ld2451_uart).read_array(buffer, 12);

              int16_t raw_speed = (int16_t)(buffer[6] | (buffer[7] << 8));
              uint16_t raw_distance = (uint16_t)(buffer[4] | (buffer[5] << 8));

              // Convert m/s raw output to km/h
              float speed_ms = abs(raw_speed) / 10.0f;
              float speed_kmh = speed_ms * 3.6f;
              float distance_m = raw_distance / 100.0f;

              if (speed_kmh > 1.0) {
                id(vehicle_speed_kmh).publish_state(speed_kmh);
                id(vehicle_distance).publish_state(distance_m);
              } else {
                id(vehicle_speed_kmh).publish_state(0.0);
              }
            }
          }

# Font Definition for 128x128 screen
font:
  - file: "gfonts://Roboto"
    id: font_speed
    size: 44
  - file: "gfonts://Roboto"
    id: font_unit
    size: 16

# Onboard Display Component
display:
  - platform: ili9xxx
    model: st7789v
    id: onboard_display
    dimensions:
      height: 128
      width: 128
      offset_height: 1
      offset_width: 2
    cs_pin: GPIO35
    dc_pin: GPIO36
    reset_pin: GPIO34
    invert_colors: true
    transform:
      mirror_x: true
      mirror_y: true
    data_rate: 40MHz
    lambda: |-
      if (id(vehicle_speed_kmh).has_state()) {
        float spd = id(vehicle_speed_kmh).state;
        
        // Large speed value
        it.printf(64, 15, id(font_speed), Color::WHITE, TextAlign::TOP_CENTER, "%.0f", spd);
        
        // Units
        it.printf(64, 80, id(font_unit), Color::CYAN, TextAlign::TOP_CENTER, "KM/H");
      } else {
        it.printf(64, 50, id(font_unit), Color::WHITE, TextAlign::TOP_CENTER, "RADAR READY");
      }