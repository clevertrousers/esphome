substitutions:
  node_name: lolin-s3-mini-pro-radar2
  node_friendly_name: Vehicle Speed Radar

esphome:
  name: ${node_name}
  friendly_name: ${node_friendly_name}
  on_boot:
    priority: 1000.0  # Run early to initialize power rails before display & RMT
    then:
      - output.turn_on: neopixel_power
      - output.turn_on: display_backlight_pin
      - delay: 50ms   # Allow power rails to settle
      # Initialize sensors to 0 on startup
      - lambda: |-
          id(vehicle_speed_mph).publish_state(0.0);
          id(vehicle_distance).publish_state(0.0);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_SECURE_ENABLE_TEE: "n"
      CONFIG_ESP_TEE_ENABLE: "n"

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:
  encryption:
    key: !secret lolin_s3_mini_pro_radar2__encryption_key

ota:
  - platform: esphome
    password: !secret lolin_s3_mini_pro_radar2__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: lolin-s3-mini-p Fallback Hotspot
    password: !secret lolin_s3_mini_pro_radar2__ap_password

captive_portal:

# GPIO Outputs for Power Rails & Backlight
output:
  - platform: gpio
    pin:
      number: GPIO33
      mode: OUTPUT
    inverted: true # Active-low backlight drive (driving LOW enables backlight)
    id: display_backlight_pin

  - platform: gpio
    pin:
      number: GPIO7
      mode: OUTPUT
    inverted: true # Inverted so driving "ON" pulls GPIO7 LOW to energize NeoPixel power
    id: neopixel_power

# Onboard WS2812B RGB Light Configuration
light:
  - platform: esp32_rmt_led_strip
    pin: GPIO8
    num_leds: 1
    chipset: ws2812
    rgb_order: RGB
    id: onboard_rgb
    name: "Onboard RGB Light"

# Onboard Hardware Buttons (Matched to physical PCB silkscreen)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "Left Button"
    on_press:
      then:
        - light.turn_on:
            id: onboard_rgb
            brightness: 100%
            red: 0%
            green: 0%
            blue: 100%
    on_release:
      then:
        - light.turn_off: onboard_rgb

  - platform: gpio
    pin:
      number: GPIO47
      mode: INPUT_PULLUP
      inverted: true
    name: "Center Button"
    on_press:
      then:
        - light.turn_on:
            id: onboard_rgb
            brightness: 100%
            red: 100%
            green: 0%
            blue: 0%
    on_release:
      then:
        - light.turn_off: onboard_rgb

  - platform: gpio
    pin:
      number: GPIO48
      mode: INPUT_PULLUP
      inverted: true
    name: "Right Button"
    on_press:
      then:
        - light.turn_on:
            id: onboard_rgb
            brightness: 100%
            red: 0%
            green: 100%
            blue: 0%
    on_release:
      then:
        - light.turn_off: onboard_rgb

# SPI Bus for onboard TFT screen
spi:
  clk_pin: GPIO40
  mosi_pin: GPIO38

# Hardware UART for LD2451 (Wiring: LD2451 TX -> GPIO44, LD2451 RX -> GPIO43)
uart:
  - id: ld2451_uart
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 115200

# Template Sensors for Radar Data
sensor:
  - platform: template
    name: "Vehicle Speed (mph)"
    id: vehicle_speed_mph
    unit_of_measurement: "mph"
    accuracy_decimals: 0
    icon: "mdi:speedometer"

  - platform: template
    name: "Vehicle Distance"
    id: vehicle_distance
    unit_of_measurement: "m"
    accuracy_decimals: 1
    icon: "mdi:ruler"

# LD2451 UART Frame Parser
interval:
  - interval: 100ms
    then:
      - lambda: |-
          while (id(ld2451_uart).available() >= 16) {
            uint8_t header[4];
            id(ld2451_uart).read_array(header, 4);

            // Match LD2451 frame header (0xAA 0xFF)
            if (header[0] == 0xAA && header[1] == 0xFF) {
              uint8_t buffer[12];
              id(ld2451_uart).read_array(buffer, 12);

              int16_t raw_speed = (int16_t)(buffer[6] | (buffer[7] << 8));
              uint16_t raw_distance = (uint16_t)(buffer[4] | (buffer[5] << 8));

              // Convert m/s raw output to mph (1 m/s = ~2.23694 mph)
              float speed_ms = abs(raw_speed) / 10.0f;
              float speed_mph = speed_ms * 2.23694f;
              float distance_m = raw_distance / 100.0f;

              if (speed_mph >= 1.0f) {
                id(vehicle_speed_mph).publish_state(speed_mph);
                id(vehicle_distance).publish_state(distance_m);
              } else {
                id(vehicle_speed_mph).publish_state(0.0f);
              }
            }
          }

# Font Definitions for 128x128 screen
font:
  - file: "gfonts://Roboto"
    id: font_speed
    size: 44
  - file: "gfonts://Roboto"
    id: font_unit
    size: 16

# Onboard ST7789 Display Component
display:
  - platform: mipi_spi
    model: ST7789V
    id: onboard_display
    dimensions:
      height: 128
      width: 128
    # Common ST7789 offset fixes for 128x128 sub-panels:
      offset_width: 2
      offset_height: 1
      pad_width: 0
      pad_height: 0
    cs_pin: GPIO35
    dc_pin: GPIO36
    reset_pin: GPIO34
    invert_colors: true
    transform:
      mirror_x: true
      mirror_y: true
      swap_xy: false
    data_rate: 8MHz
    lambda: |-
      float spd = id(vehicle_speed_mph).state;
      if (std::isnan(spd)) {
        spd = 0.0f;
      }
      
      // Render large target speed
      it.printf(64, 15, id(font_speed), Color::WHITE, TextAlign::TOP_CENTER, "%.0f", spd);
      
      // Render unit label
      it.printf(64, 80, id(font_unit), Color(0, 255, 255), TextAlign::TOP_CENTER, "MPH");