# Board: ESP32-C3 DevKitM-1 (Espressif)
# Definition: definitions/boards/esp32-c3-devkitm-1/manifest.yaml

esphome:
  name: esp32c3minitest2
  friendly_name: esp32c3minitest2

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "sCmXIDuthv9eBu/S4nplUVk2mnvjhKPdLpW+PPeyHBI="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: NONE
  output_power: 8.5dBm
  
  ap:
    ssid: esp32c3minitest Fallback Hotspot
    password: "Ke1fOvs7MGGm"

captive_portal:

  # Configure the GPIO pin as a PWM output for dimming capability
output:
  - platform: ledc
    pin:
      number: GPIO8
      inverted: true  
    id: gpio8_led_output
    
# Expose the output as a switchable light in Home Assistant
light:
  - platform: monochromatic
    name: "ESP32C3 Onboard LED"
    output: gpio8_led_output

uart:
  id: uart_bus
  tx_pin: GPIO5
  rx_pin: GPIO4
  baud_rate: 256000

ld2410:
  id: ld2410_radar

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence"
    has_moving_target:
      name: "Moving Target"
    has_still_target:
      name: "Still Target"

sensor:
  - platform: ld2410
    moving_distance:
      name: "Moving Distance"
    still_distance:
      name: "Still Distance"