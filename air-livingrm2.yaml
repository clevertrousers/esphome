substitutions:
  name: air-livingrm2
  friendly_name: "Air Quality Living Room"
  myid: airlvrm2
  
esphome:
  name: $name
  friendly_name: $friendly_name

esp8266:
  board: d1_mini

# Enable logging
logger:

captive_portal:

# Enable Home Assistant API
api:
  encryption:
    key: !secret ac_encryption_key

ota:
  platform: esphome
  password: "6989bc8ebb63dbde23e0f335d1aa9695"

wifi:
  ssid: "As you wish"
  password: "6037424348"

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${friendly_name} Hotspot
    password: "V0cKJEQA5oAf"

time:
  - platform: homeassistant
    id: ${myid}_time
    update_interval: 60min

# Text sensors with general information.
text_sensor:
  # Expose ESPHome version as sensor.
  - platform: version
    name: "${name} ESPHome Version"
    id: ${myid}version
  # Expose WiFi information as sensors.
  - platform: wifi_info
    ip_address:
      name: "${name} IP"
      id: ${myid}ip
    ssid:
      name: "${name} SSID"
      id: ${myid}ssid
    bssid:
      name: "${name} BSSID"
      id: ${myid}bssid
light:
  - platform: status_led
    name: "Switch state"
    id: ${myid}status
    pin: GPIO2


uart:
  rx_pin: D2
  baud_rate: 9600
  id: ${myid}uart

one_wire:
  - platform: gpio
    pin: GPIO0
#    id: ${myid}dallas
  #0xb93cf8f648334d28

# Sensors with general information.
sensor:
  # Uptime sensor.
  - platform: uptime
    name: "${name} Uptime"
    id: ${myid}uptime
    update_interval: 5min

  # WiFi Signal sensor.
  - platform: wifi_signal
    name: "${name} WiFi Signal"
    id: ${myid}wifisignal
    update_interval: 5min

  # air quality sensor
  - platform: pm1006
    id: ${myid}pm_2_5
    pm_2_5:
      name: "${name} 2.5µm"

  # temp
  - platform: dallas_temp
    address: 0xb93cf8f648334d28
    name: "${name} Temperature"
    update_interval: 30s
    id: ${myid}temp
    filters:
#      - lambda: return ( ( ( ( x * 9 / 5 ) + 32 ) * 0.9384 ) - 0.2246 -32 ) * 5 / 9;
      - calibrate_linear:
          - 25.11 -> 21.83
#          - 23.22 -> 20.56
          - 22.78 -> 19.72
#          - 22.39 -> 19.83
#          - 21.11 -> 18.44
          - 20.89 -> 17.89
          - 18.78 -> 15.94

switch:
  - platform: restart
    name: "${name} Restart"
    id: ${myid}restart
    


    