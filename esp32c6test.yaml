# Board: Espressif ESP32-C6-DevKitM-1 (Espressif)
# Definition: definitions/boards/esp32-c6-devkitm-1/manifest.yaml

esphome:
  name: esp32c6test
  friendly_name: esp32c6test

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf
    version: latest

logger:

api:
  encryption:
    key: "Zd66xXDIBPazYs+znmr3QQyXd1yl9zU9OLMQqZitjbo="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: esp32c6test Fallback Hotspot
    password: "h9iOOpl5rtQu"

captive_portal:

esp32_ble_tracker:
  on_ble_advertise:
    - then:
        - lambda: |-
            id(latest_ble_mac).publish_state(x.address_str());

text_sensor:
  - platform: template
    name: "Latest Detected BLE MAC"
    id: latest_ble_mac
    icon: "mdi:bluetooth"

light:
  - platform: monochromatic
    name: ${friendly_name} Built-in LED"
    output: led_output

output:
  - platform: ledc
    pin:
      number: GPIO15
      inverted: true  
    id: led_output