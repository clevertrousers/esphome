# Board: Generic - BK7231T (Tuya QFN32)
# Definition: definitions/boards/generic-bk7231t-qfn32-tuya/manifest.yaml

esphome:
  name: daybetter4
  friendly_name: daybetter4

bk72xx:
  board: generic-bk7231t-qfn32-tuya

logger:

api:
  encryption:
    key: "z9it1TTSE2ZfWjq9BNhwkyEIP85svP2Xhqc9NbYnSlU="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: daybetter4 Fallback Hotspot
    password: "JOB7GxhDwqYq"

captive_portal:

web_server:
  port: 80

# Swapped pins for BP5758D
bp5758d:
  data_pin: P7
  clock_pin: P8

output:
  # Power gate pin
  - platform: gpio
    pin: P26
    id: power_mosfet

  # BP5758D Channels
  - platform: bp5758d
    id: output_red
    channel: 1
    current: 20
  - platform: bp5758d
    id: output_green
    channel: 2
    current: 20
  - platform: bp5758d
    id: output_blue
    channel: 3
    current: 20
  - platform: bp5758d
    id: output_white
    channel: 4
    current: 20
  - platform: bp5758d
    id: output_warm_white
    channel: 5
    current: 20

light:
  - platform: rgbww
    name: "daybetter4Light"
    id: daybetter4_light
    red: output_red
    green: output_green
    blue: output_blue
    cold_white: output_white
    warm_white: output_warm_white
    cold_white_color_temperature: 6500K
    warm_white_color_temperature: 2700K