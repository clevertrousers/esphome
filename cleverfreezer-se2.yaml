substitutions:
  name: cleverfreezer-se2
  friendly_name: "Bacon Freezer"
  idname: cleverfreezer-se
  
esphome:
  name: $name
  friendly_name: $friendly_name

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "WjX6Y5Wc+l9T19NsZw+mXbQ51zbi1G/8UjCKKTjDe7s="

ota:
  platform: esphome
  password: "0b8358b18fdda8314f3a8faca33a1a6d"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "BaconFF"
    password: "c78De5sCR4GN"


captive_portal:

# Temp Sensor
one_wire:
  - platform: gpio
    pin: GPIO04

#dallas:
#  - pin: GPIO04
#    update_interval: 120s
#0x2e3c0df648631028

sensor:
  - platform: dallas_temp
    address: 0x2e3c0df648631028
    name: "BaconFF"
    id: temp
    update_interval: 120s
    force_update: True
    on_value_range:
      - above: -7
        then:
          - logger.log: "Freezer 2 temp too warm!!"
      - below: -12
        then:
          - logger.log: "Freezer 2 Temp OK"

  # WiFi Signal sensor.
  - platform: wifi_signal
    name: "BaconFF WiFi Signal"
    update_interval: 5min