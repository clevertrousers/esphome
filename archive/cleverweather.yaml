esphome:
  name: cleverweather

esp8266:
  board: d1

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "IUbGEdsxcpUGhXHBLi5h6dnVgSrbY1bWg3QG/Jf8iAw="

ota:
  password: "f7529956a58dae4bfca76ecfdd3e85cb"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "CleverWeather Fallback Hotspot"
    password: "6037424348"

captive_portal:

light:
  - platform: status_led
    name: "CleverWeather Status"
    pin: 
      number: GPIO2
      inverted: true

i2c:
  sda: GPIO4
  scl: GPIO5

sensor:
  - platform: bme280
    temperature:
      name: "CleverWeather Temperature"
      oversampling: 16x
    pressure:
      name: "CleverWeather Pressure"
    humidity:
      name: "CleverWeather Humidity"
    address: 0x76
    update_interval: 60s