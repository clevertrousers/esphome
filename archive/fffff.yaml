substitutions:
  name: fffff
  friendly_name: "Fffff"

esphome:
  name: $name
  friendly_name: $friendly_name
#  on_boot:
#    priority: 200  
#    then:
#      - wait_until:  
#          condition:
#            wifi.connected: 
#          timeout: 30s

esp32:
  board: lolin_c3_mini
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "4GCeNDV4Dpo5HMEQmLImCoIILPiuCFGzJp2RXR+l7to="

ota:
  password: "6037424348"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Fffff Fallback Hotspot"
    password: "6037424348"

captive_portal:

sensor:
  # Uptime sensor.
  - platform: uptime
    name: "${name} Uptime"
    update_interval: 15sec

  # WiFi Signal sensor.
  - platform: wifi_signal
    name: "${name} WiFi Signal"
    update_interval: 15sec

text_sensor:
  # Expose WiFi information as sensors.
  - platform: wifi_info
    ip_address:
      name: ${name} IP
    ssid:
      name: ${name} SSID
    bssid:
      name: ${name} BSSID
    mac_address:
      name: ${name} Mac
